# シナリオCSV → Irodori-TTS 一括音声生成ツール 設定例
# 実運用時は config.yaml にコピーしてパスを埋める。詳細は SPEC.md を参照。
# キャラ定義・LoRA パス・生成ファイル名は CSV 側で定義する（config には持たない）。

project:
  csv_file:      "scenario.csv"         # 既定の入力 CSV（--csv で上書き可）
  voice_out_dir: "voices"               # 音声(.wav)の出力先
  preview_dir:   "preview"              # お試し生成の保存先（見えるフォルダ）
  cache_dir:     ".irodori_cache"       # TTS キャッシュ
  state_file:    ".irodori_state.json"  # 差分判定の状態

csv:
  encoding: "utf-8-sig"  # UTF-8(BOM有無どちらも可)。日本語Excel保存なら cp932 も指定可

irodori:
  repo_dir:   "/path/to/Irodori-TTS"        # infer.py のあるディレクトリ（ここをカレントにして実行）
  # infer.py を「Irodori-TTS の依存が入った環境」で動かすコマンド。
  #   例) uv 管理でGPU(CUDA)なら "uv run --extra cu128 python"
  #       ※ --extra cu128 を付けないと uv が毎回 CPU 版 torch に同期し直し、CPUで生成されて遅くなる。
  #       ※ CUDA 版が入っているかは repo_dir で次を確認:
  #          uv run --extra cu128 python -c "import torch; print(torch.__version__, torch.cuda.is_available())"
  #          → "...+cu128 True" ならGPUで生成できる。
  #   例) 専用 venv があるなら "E:/ai_voice/Irodori-TTS/Irodori-TTS/.venv/Scripts/python.exe"
  # ※ repo_dir をカレントにして実行するので、tyrano 側の .venv は使われません。
  runner:     "uv run --extra cu128 python"
  # v4: キャプション（声質・感情の自由文指定）対応の統合モデル。
  #   旧 v3 を使うなら "Aratako/Irodori-TTS-500M-v3"（キャプションは無効）。
  checkpoint: "Aratako/Irodori-TTS-v4.1-Small"
  num_steps:  32
  seconds:    null
  # v4: キャプションの効き具合（null なら infer 既定の 3.0）。強めたいなら 4〜5 等。
  cfg_scale_caption: null
  # 話者の与え方（話者条件付き checkpoint では必須）。LoRA で声を作る場合は "no-ref"。
  #   no-ref    : 参照音声なし（LoRA が声を担う）※LoRA 運用の既定
  #   ref-wav   : ref_path に参照音声(.wav)を指定
  #   ref-embed : ref_path に学習済みスピーカー埋め込みを指定
  #   none      : 何も付けない（extra_args で自前指定）
  ref_mode:   "no-ref"
  ref_path:   null
  # 実行デバイス / 精度。GPUで生成するなら "cuda"（お試し生成・一括生成の両方に効く）。
  #   ※ runner が CUDA 版 torch を使える状態（上の --extra cu128 等）であること。
  #   ※ GPUが無い/使わない場合だけ "cpu" にする。
  device:     "cuda"    # "cuda" | "cpu" | "cuda:0"
  precision:  "bf16"    # "bf16" | "fp32"（GPUなら bf16 推奨）
  extra_args: []

on_empty_text: "skip" # skip | error
